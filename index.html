<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>붕神 계좌 번호</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #FDF5E6;     /* 따뜻한 베이지색 배경 */
            --point-color: #FFA500;  /* 붕어빵 주황색 */
            --text-color: #5D4037;   /* 짙은 갈색 텍스트 */
            --btn-bg: #D84315;       /* 버튼: 붉은 갈색 */
            --btn-shadow: #870000;   /* 버튼 그림자 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Jua', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 상단/하단 체크무늬 장식 */
        .deco-bar {
            position: absolute;
            left: 0;
            width: 100%;
            
            /* [수정 1] 높이를 화면의 25%(1/4)로 설정 */
            height: 20vh; 
            
            background-image: linear-gradient(90deg, var(--point-color) 50%, transparent 50%),
                              linear-gradient(var(--point-color) 50%, transparent 50%);
            
            /* [수정 2] 영역이 커진 만큼 무늬 크기도 80px로 확대 */
            background-size: 80px 80px; 
            opacity: 0.6;
            
            /* 텍스트 뒤로 가도록 설정 (화면이 작을 때 글씨 가림 방지) */
            z-index: 0;
        }

        .top { top: 0; }
        
        .bottom { 
            bottom: 0; 
            /* 아래쪽 무늬 반전 (180도 회전) */
            transform: rotate(180deg); 
        }

        /* 메인 컨텐츠 영역 */
        .container {
            text-align: center;
            width: 100%;
            z-index: 1; /* 체크무늬보다 위에 오도록 설정 */
            position: relative;
        }

        h1 {
            color: var(--text-color);
            font-size: 3rem;
            margin-bottom: 50px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        /* 버튼 스타일 */
        .copy-btn {
            width: 80%;
            max-width: 500px;
            padding: 20px 0;
            font-family: 'Jua', sans-serif;
            font-size: 1.8rem;
            color: white;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--btn-shadow);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .copy-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-shadow);
        }

        /* 토스트 메시지 스타일 */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 27vh; /* 체크무늬 위쪽으로 살짝 올라오게 위치 조정 */
        }
    </style>
</head>
<body>

    <div class="deco-bar top"></div>

    <div class="container">
        <h1>붕神 계좌 번호</h1>
        <button class="copy-btn" onclick="copyAccount()">계좌 번호 복사하기</button>
    </div>
    
    <div class="deco-bar bottom"></div>

    <div id="toast">복사 되었습니다</div>

    <script>
        function copyAccount() {
            const accountNumber = '농협 217063-5207-4455';

            navigator.clipboard.writeText(accountNumber).then(() => {
                showToast();
            }).catch(err => {
                console.error('복사 실패:', err);
                alert('복사에 실패했습니다. 직접 복사해주세요.\n' + accountNumber);
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }
    </script>
</body>
</html>
