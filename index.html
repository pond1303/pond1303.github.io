<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>붕神 계좌 번호</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            
            /* 배경 설정 */
            background-image: url('background.png');
            background-size: cover;      /* 화면 꽉 차게 (비율 유지) */
            background-position: center; /* 중앙 정렬 */
            background-repeat: no-repeat;
            
            /* 어디를 눌러도 된다는 느낌을 주는 커서 */
            cursor: pointer;
            
            /* 텍스트 드래그 방지 (앱처럼 보이게) */
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* 토스트 메시지 스타일 */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: rgba(0, 0, 0, 0.8); /* 약간 투명한 검정 */
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);
            font-size: 1.2rem;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 80px; /* 살짝 위로 떠오르는 효과 */
        }
    </style>
</head>
<body>

    <div id="toast">복사 되었습니다</div>

    <script>
        // 화면 전체에 클릭 이벤트 리스너 추가
        document.body.addEventListener('click', function() {
            copyAccount();
        });

        function copyAccount() {
            const accountNumber = '국민 27410104216982';

            // 클립보드 복사
            navigator.clipboard.writeText(accountNumber).then(() => {
                showToast();
            }).catch(err => {
                console.error('복사 실패:', err);
                // 보안상 이유로 자동 복사가 막힌 경우 대비 (오래된 브라우저 등)
                prompt("이 계좌번호를 복사하세요:", accountNumber);
            });
        }

        let isToastShown = false; // 토스트 중복 실행 방지 플래그

        function showToast() {
            if (isToastShown) return;
            
            isToastShown = true;
            const toast = document.getElementById("toast");
            toast.className = "show";

            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
                isToastShown = false;
            }, 2000); // 2초 뒤 사라짐
        }
    </script>

</body>
</html>
