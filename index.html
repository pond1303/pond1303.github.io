<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>붕神 계좌 번호</title>
    <style>
        :root {
            --bg-color: #FDF5E6;     /* 배경색: 따뜻한 베이지 */
            --check-color: #D84315;  /* 체크무늬: 진한 주황색 (요청 반영) */
            --check-size: 70px;      /* 체크무늬 크기: 더 크게 (요청 반영) */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* 스크롤 방지 */
            font-family: sans-serif;
        }

        /* === 상단/하단 체크무늬 패턴 (CSS로 구현) === */
        .pattern-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: var(--check-size); /* 패턴 높이 */
            
            /* 체크무늬 생성 로직 */
            background-image: 
                linear-gradient(90deg, var(--check-color) 50%, transparent 50%),
                linear-gradient(var(--check-color) 50%, transparent 50%);
            background-size: var(--check-size) var(--check-size);
            opacity: 0.9;
        }

        .top { top: 0; }
        .bottom { bottom: 0; }

        /* === 메인 컨텐츠 (로고 + 버튼) === */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* 로고와 버튼 사이 간격 */
            width: 100%;
            z-index: 1; /* 패턴 위에 올라오도록 설정 */
        }

        /* 로고 이미지 스타일 */
        .logo-img {
            width: 180px; /* 로고 크기 조절 */
            max-width: 40%;
            height: auto;
            border-radius: 50%; /* 로고가 원형이라면 깔끔하게 */
            /* 약간의 그림자 (선택사항) */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* 버튼 이미지 스타일 */
        .btn-img {
            width: 80%;       /* 화면 너비의 80% */
            max-width: 500px; /* 너무 커지지 않게 제한 */
            cursor: pointer;
            transition: transform 0.1s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        .btn-img:active {
            transform: scale(0.96); /* 클릭 시 살짝 눌리는 효과 */
        }

        /* === 토스트 메시지 스타일 === */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: rgba(50, 30, 20, 0.9); /* 진한 갈색 배경 */
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: calc(var(--check-size) + 20px); /* 하단 패턴보다 위에 뜨도록 */
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: calc(var(--check-size) + 50px); /* 살짝 위로 떠오르는 효과 */
        }
    </style>
</head>
<body>

    <div class="pattern-bar top"></div>

    <div class="container">
        <img src="logo.png" alt="붕神 로고" class="logo-img">
        
        <img src="button.png" alt="계좌 복사 버튼" class="btn-img" onclick="copyAccount()">
    </div>

    <div class="pattern-bar bottom"></div>

    <div id="toast">계좌번호가 복사되었습니다!</div>

    <script>
        function copyAccount() {
            const accountNumber = '국민 27410104216982';

            navigator.clipboard.writeText(accountNumber).then(() => {
                showToast();
            }).catch(err => {
                console.error('복사 실패:', err);
                alert('복사 실패! 직접 복사해주세요: ' + accountNumber);
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 2500);
        }
    </script>

</body>
</html>
