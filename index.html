
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클립보드 복사 예제</title>
    <style>
        /* 버튼을 화면 중앙에 배치하고 스타일을 꾸미는 CSS */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <button onclick="copyText()">Hello World 복사하기</button>

    <script>
        function copyText() {
            const textToCopy = 'hello world';

            // 최신 클립보드 API 사용
            navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    // 성공 시 알림
                    alert('클립보드에 "' + textToCopy + '"가 저장되었습니다!');
                })
                .catch(err => {
                    // 실패 시 에러 로그
                    console.error('복사 실패:', err);
                    alert('복사에 실패했습니다.');
                });
        }
    </script>

</body>
</html>
